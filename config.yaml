# click-tt Tournament Watcher Konfiguration

# Discord-Webhook (besser als GitHub-Secret DISCORD_WEBHOOK setzen)
webhook: ""

# Verband/Circuit
federation: "TTVN"
circuit: "TTVN-Race 26"

# Anzahl zusätzlicher Monate neben dem aktuellen
months_advance: 3

# Watchlist: Personen deren Anmeldungen (Haupt oder Warteliste) gemeldet werden
# Substring-Match, case-insensitive, Reihenfolge Vor-/Nachname egal
watchlist:
  - "Timo Rischer"
  - "Tomte Schäpker"

# "Self": DU selbst. Zusätzlich zur normalen Anmelde-Benachrichtigung wird
# dein Warteliste→Hauptfeld-Wechsel am Meldeschluss-Tag stündlich überwacht
# (zwischen 12 Uhr am Meldeschluss-Tag und 12 Uhr am Turniertag).
# Format "Nachname, Vorname" (wie auf click-tt).
self: "Klöver, Dennis"
